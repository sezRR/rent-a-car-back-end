info:
  name: Is Rentable
  type: http
  seq: 4

http:
  method: POST
  url: '{{baseUrl}}/api/rentals/isrentable'
  body:
    type: json
    data: |
      {
        "carId": {{carId}},
        "customerId": {{customerId}},
        "rentDate": "2026-10-01T10:00:00Z",
        "returnDate": "2026-10-05T10:00:00Z"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
