info:
  name: Get By User Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/customers/getcustomersbyuserid?userId={{userId}}"
  params:
    - name: userId
      value: "{{userId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
