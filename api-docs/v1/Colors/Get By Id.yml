info:
  name: Get By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/colors/getbyid?id={{colorId}}"
  params:
    - name: id
      value: "{{colorId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
