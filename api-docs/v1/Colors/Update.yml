info:
  name: Update
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/colors/update"
  body:
    type: json
    data: |
      {
        "id": {{colorId}},
        "colorName": "Blue"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
