info:
  name: Get By Car Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/carimages/getbycarid?carId={{carId}}"
  params:
    - name: carId
      value: "{{carId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
