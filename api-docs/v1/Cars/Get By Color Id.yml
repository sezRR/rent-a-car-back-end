info:
  name: Get By Color Id
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cars/getcarsbycolorid?colorId={{colorId}}"
  params:
    - name: colorId
      value: "{{colorId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
