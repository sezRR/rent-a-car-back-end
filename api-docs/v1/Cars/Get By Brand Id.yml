info:
  name: Get By Brand Id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cars/getcarsbybrandid?brandId={{brandId}}"
  params:
    - name: brandId
      value: "{{brandId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
