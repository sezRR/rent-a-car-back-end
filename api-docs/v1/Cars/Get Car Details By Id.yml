info:
  name: Get Car Details By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cars/getcardetailsbyid?id={{carId}}"
  params:
    - name: id
      value: "{{carId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
