info:
  name: Get By Brand And Color
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/cars/getcarsbybrandidandcolorid?brandId={{brandId}}&colorId={{colorId}}"
  params:
    - name: brandId
      value: "{{brandId}}"
      type: query
    - name: colorId
      value: "{{colorId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
