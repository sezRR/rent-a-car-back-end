info:
  name: List By Brand And Color
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cars?brandId={{brandId}}&colorId={{colorId}}"
  params:
    - name: brandId
      value: "{{brandId}}"
      type: query
    - name: colorId
      value: "{{colorId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
