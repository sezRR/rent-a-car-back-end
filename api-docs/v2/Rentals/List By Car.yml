info:
  name: List By Car
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/rentals?carId={{carId}}"
  params:
    - name: carId
      value: "{{carId}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
