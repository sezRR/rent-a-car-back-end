info:
  name: Create Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v2/auth/tokens"
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "password": "Password123!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
