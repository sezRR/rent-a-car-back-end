info:
  name: Replace
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/cars/{{carId}}/images/{{carImageId}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "{{imageFilePath}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
