info:
  name: List By Email
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/users?email={{email}}"
  params:
    - name: email
      value: "{{email}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
